<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlicetleLabs — Rental Admin Mockup</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap');
:root{--ink:#29252f;--muted:#877f8d;--purple:#9270df;--lav:#f1eaff;--line:#ebe4f0;--green:#e8f8ed;--yellow:#fff5d6;--red:#faecef;--bg:#fbf9fd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",sans-serif}
.app{max-width:780px;margin:auto;min-height:100vh;padding:20px 16px 70px;background:linear-gradient(#f1ebff 0,#fff 230px)}
.login{max-width:390px;margin:12vh auto;padding:24px 18px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px #654f7c14}.login h1{font-size:22px;margin:0 0 4px}.login p{font-size:12px;color:var(--muted);margin:0 0 18px}.login input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;margin-bottom:9px}.login button{width:100%;border:0;background:var(--ink);color:#fff;border-radius:13px;padding:12px;font:700 12px inherit;cursor:pointer}.login .error{color:#a64e62;font-size:11px;margin:8px 0;min-height:16px}
.brand{display:flex;justify-content:space-between;align-items:center}.logo{font:700 20px Poppins,sans-serif}.logo b{color:var(--purple)}.adminTag{font-size:10px;font-weight:800;background:white;border:1px solid var(--line);padding:6px 9px;border-radius:999px}
.hero{padding:27px 2px 15px}.hero small{font:700 10px Poppins,sans-serif;color:#785db2;letter-spacing:.7px}.hero h1{margin:5px 0 3px;font-size:28px}.hero p{margin:0;color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 15px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font:700 20px Poppins,sans-serif}.stat span{font-size:10px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:15px 0 9px}.toolbar h2{font-size:15px;margin:0}.add{border:0;background:var(--ink);color:white;border-radius:12px;padding:9px 12px;font:700 11px inherit;cursor:pointer}
.events{display:grid;gap:10px}.event{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 22px #654f7c0b}
.eventtop{display:flex;justify-content:space-between;gap:12px}.event h3{font-size:14px;margin:0}.meta{font-size:10px;color:var(--muted);margin-top:3px}.eventActions{display:flex;align-items:center;gap:6px;flex:0 0 auto}.edit,.danger{border:0;border-radius:10px;padding:7px 10px;font:700 10px inherit;cursor:pointer}.edit{background:var(--lav);color:#7155ad}.danger{background:var(--red);color:#9a5968}.switch{display:inline-flex;align-items:center;cursor:pointer}.switch input{position:absolute;opacity:0;pointer-events:none}.slider{width:34px;height:20px;background:#d9d4dc;border-radius:999px;position:relative;transition:.2s}.slider:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #0002;transition:.2s}.switch input:checked+.slider{background:#35c759}.switch input:checked+.slider:before{transform:translateX(14px)}
.dayrows{display:grid;gap:7px;margin-top:12px}.dayrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed #eee8f1}.dayname{font:700 12px Poppins,sans-serif}.status{border:0;border-radius:999px;padding:7px 10px;font:700 9px inherit;cursor:pointer}.available{background:var(--green);color:#39834d}.pending{background:var(--yellow);color:#987818}.booked{background:var(--red);color:#9a5968}
.price{font-size:10px;color:#7258a9;font-weight:700;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:#2d273650;align-items:flex-end;justify-content:center;padding:0;z-index:5}.modal.on{display:flex}
.resultModal{display:none;position:fixed;inset:0;background:#2d273680;align-items:center;justify-content:center;padding:20px;z-index:10}.resultModal.on{display:flex}.resultCard{width:min(360px,100%);background:#fff;border-radius:25px;padding:28px 22px 22px;text-align:center;box-shadow:0 18px 55px #392e4b38;animation:popIn .2s ease-out}.resultIcon{width:58px;height:58px;margin:0 auto 13px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800}.resultModal.success .resultIcon{background:var(--green);color:#35a653}.resultModal.error .resultIcon{background:var(--red);color:#b35e70}.resultCard h2{font-size:19px;margin:0 0 6px}.resultCard p{font-size:12px;line-height:1.6;color:var(--muted);margin:0;white-space:pre-line}.resultClose{width:100%;border:0;background:var(--ink);color:#fff;border-radius:14px;padding:12px;margin-top:19px;font:700 12px inherit;cursor:pointer}@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.sheet{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:19px 17px 28px}.handle{width:42px;height:4px;background:#ded8e2;border-radius:9px;margin:0 auto 15px}
.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:18px;margin:0}.close{border:0;background:#f4f0f6;border-radius:50%;width:31px;height:31px;cursor:pointer}
.section{margin-top:18px}.sectiontitle{font-size:12px;font-weight:800;margin-bottom:8px}.field{margin-bottom:9px}.field label{font-size:9px;color:var(--muted);display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font:500 12px inherit;background:white;outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dateinput{display:grid;grid-template-columns:1fr 92px 34px;gap:7px;margin-bottom:7px}.dateinput select{border:1px solid var(--line);border-radius:12px;padding:9px;font:700 10px inherit}.removeRow{border:1px solid #f0d9df;background:#fff7f8;color:#a25d6c;border-radius:10px;font-size:16px;cursor:pointer}
.addline{border:1px dashed #cfc3dc;background:#faf7ff;color:#7659ae;border-radius:12px;padding:9px;width:100%;font:700 10px inherit;cursor:pointer}
.promo{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:end;margin-bottom:7px}.preview{background:#f8f4ff;border-radius:15px;padding:11px;margin-top:9px;font-size:11px;line-height:1.8}.preview b{color:#7355b6}.save{width:100%;border:0;background:var(--ink);color:white;border-radius:14px;padding:12px;font:700 12px inherit;margin-top:17px;cursor:pointer}.save:disabled{opacity:.55;cursor:wait}.statusMessage{min-height:20px;margin-top:10px;text-align:center;font-size:11px;font-weight:700}.statusMessage.success{color:#39834d}.statusMessage.error{color:#a25d6c}
.note{font-size:9px;color:var(--muted);margin-top:8px;text-align:center}
@media(min-width:650px){.events{grid-template-columns:1fr 1fr}.sheet{border-radius:25px;margin-bottom:20px}.modal{align-items:center;padding:20px}}
</style></head>
<body><section class="login" id="login"><h1>เข้าสู่หลังบ้าน 💜</h1><p>สำหรับทีม AlicetleLabs เท่านั้น</p><input id="loginEmail" type="email" placeholder="อีเมล" autocomplete="username"><input id="loginPassword" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><div class="error" id="loginError"></div><button id="loginButton">เข้าสู่ระบบ</button></section>
<main class="app" id="adminApp" hidden>
<div class="brand"><div class="logo">alicetle<b>Labs</b> ♡</div><span><span class="adminTag">ADMIN</span> <button class="edit" id="logout">ออกจากระบบ</button></span></div>
<section class="hero"><small>RENTAL MANAGEMENT</small><h1>จัดการคิวเช่า 💜</h1><p>เพิ่มคอน อัปเดตสถานะ และตั้งโปรได้จากหน้านี้</p></section>
<div class="stats"><div class="stat"><b id="av">7</b><span>คิวว่าง</span></div><div class="stat"><b id="pd">1</b><span>รอยืนยัน</span></div><div class="stat"><b id="bk">1</b><span>จองแล้ว</span></div></div>
<div class="toolbar"><h2>คอนเสิร์ตทั้งหมด</h2><button class="add" onclick="openModal()">＋ เพิ่มคอน</button></div>
<div class="statusMessage" id="appStatus" role="status" aria-live="polite"></div>
<section class="events" id="events"></section>
</main>

<div class="modal" id="modal"><div class="sheet"><div class="handle"></div>
<div class="sheethead"><h2>เพิ่มคอนเสิร์ต ✨</h2><button class="close" onclick="closeModal()">×</button></div>
<div class="section"><div class="sectiontitle">ข้อมูลคอน</div>
<div class="field"><label>ชื่อคอนเสิร์ต</label><input id="name" value="NEW CONCERT"></div>
<div class="two"><div class="field"><label>ประเภท</label><select id="cat"><option>K-POP</option><option>T-POP</option><option>อื่นๆ</option></select></div><div class="field"><label>ราคาปกติ / วัน</label><input id="base" type="number" value="890"></div></div>
<div class="field"><label>สถานที่</label><input id="venue" value="BITEC LIVE"></div>
<div class="field"><label>จุดรับ–คืน</label><input id="pickup" value="หน้า BITEC"></div></div>

<div class="section"><div class="sectiontitle">วันที่จัดงาน</div>
<div id="dateFields"><div class="dateinput"><input type="date" value="2026-10-03"><select><option>AVAILABLE</option><option>PENDING</option><option>BOOKED</option></select><button class="removeRow" type="button" onclick="removeRow(this)" aria-label="ลบวันที่">×</button></div></div>
<button class="addline" onclick="addDate()">＋ เพิ่มวันที่</button></div>

<div class="section"><div class="sectiontitle">โปรหลายวัน</div>
<div id="promoFields">
  <div class="promo promoRow">
    <div class="field"><label>จำนวนวัน</label><input class="promoDays" type="number" min="1" value="1" oninput="preview()"></div>
    <div class="field"><label>ลดจากราคาปกติ (บาท)</label><input class="promoDisc" type="number" min="0" value="80" oninput="preview()"></div>
    <button class="removeRow" type="button" onclick="removeRow(this)" aria-label="ลบโปรโมชั่น">×</button>
  </div>
</div>
<div class="preview" id="preview"></div>
<button class="addline" type="button" onclick="addPromo()">＋ เพิ่มโปร</button></div>
<button class="save" id="saveButton" onclick="saveEvent()">บันทึกคอนเสิร์ต</button>
<div class="statusMessage" id="saveStatus" role="status" aria-live="polite"></div>
<div class="note">ข้อมูลจะถูกบันทึกลง Supabase ทันที</div>
</div></div>

<div class="resultModal" id="resultModal"><div class="resultCard"><div class="resultIcon" id="resultIcon">✓</div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="resultClose" onclick="closeResultModal()">เรียบร้อย</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="admin.js"></script></body></html>
