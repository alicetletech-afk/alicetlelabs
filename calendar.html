<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlicetleLabs — Concert Calendar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fbf9ff;--card:#fff;--ink:#25222c;--muted:#8d8995;--line:#e9e2f2;--purple:#8c63d9;--lilac:#f0e7ff;--pink:#ffe7f0;--yellow:#fff2bd;--green:#e5f7eb;--greenInk:#36734b;--pending:#fff1c9;--pendingInk:#926d12;--booked:#eeeaf2;--bookedInk:#716b79;--danger:#fff0c8;--dangerInk:#8b6410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Thai",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1020px;margin:auto;padding:32px 22px 64px}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand b{color:var(--purple)}.eyebrow{margin-top:42px;color:var(--purple);font-size:12px;font-weight:900;letter-spacing:1.4px}h1{font-size:40px;line-height:1.05;letter-spacing:-1.5px;margin:8px 0}.sub{color:var(--muted);line-height:1.55}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}.month{font-size:22px;font-weight:900}.nav{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:9px 12px;font-weight:800;cursor:pointer}.btn:hover{background:var(--lilac)}.state{margin:12px 0;padding:13px 15px;border:1px solid var(--line);background:#fff;border-radius:15px;color:var(--muted);font-size:13px}.state.error{background:#fff5f5;color:#9a4242;border-color:#f2d4d4}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.dow{text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:8px 0}.day{min-height:124px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}.day.blank{opacity:.28;background:transparent}.day.conflict{outline:2px solid #e3b632;outline-offset:-1px}.num{font-size:13px;font-weight:900;margin-bottom:7px}.event{display:block;border-radius:10px;padding:6px 7px;margin-top:5px;font-size:10px;font-weight:850;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.kpop{background:var(--lilac)}.event.tpop{background:var(--pink)}.event.other{background:var(--yellow)}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}.available .status-dot{background:#52a86e}.pending .status-dot{background:#d6a626}.booked .status-dot{background:#9d96a4}.conflict-note{margin-top:6px;color:var(--dangerInk);font-size:9px;font-weight:900}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;color:var(--muted);font-size:11px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 9px}.section{margin-top:30px}.section h2{font-size:18px;margin-bottom:10px}.row{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:8px 0}.date{font-weight:900}.venue{font-size:11px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:5px;align-items:center}.badge{font-size:10px;font-weight:900;border-radius:999px;padding:6px 8px;background:var(--lilac)}.badge.available{background:var(--green);color:var(--greenInk)}.badge.pending{background:var(--pending);color:var(--pendingInk)}.badge.booked{background:var(--booked);color:var(--bookedInk)}
@media(max-width:650px){.wrap{padding:26px 15px 48px}.eyebrow{margin-top:35px}h1{font-size:32px}.sub{font-size:13px}.toolbar{margin-top:22px}.month{font-size:19px}.btn{padding:8px 10px}.calendar{gap:4px}.dow{font-size:9px}.day{min-height:94px;padding:6px;border-radius:12px}.num{font-size:10px;margin-bottom:5px}.event{font-size:8px;padding:4px 5px;border-radius:7px}.status-dot{width:5px;height:5px}.conflict-note{font-size:7px}.row{grid-template-columns:75px minmax(0,1fr);gap:10px;padding:12px}.badges{grid-column:2}.badge{font-size:9px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">alicetle<b>Labs</b> ♡</div>
  <div class="eyebrow">CONCERT RENTAL PLANNER</div>
  <h1>คอนไหนชนกันบ้าง? 🎧💜</h1>
  <div class="sub">ปฏิทินหลังบ้านสำหรับดูวันคอนและสถานะเครื่อง — อ่านข้อมูลจาก Supabase ชุดเดียวกับหน้า Customer / Admin</div>
  <div class="toolbar"><div class="month" id="monthTitle"></div><div class="nav"><button class="btn" id="prev" aria-label="เดือนก่อน">←</button><button class="btn" id="today">วันนี้</button><button class="btn" id="next" aria-label="เดือนถัดไป">→</button></div></div>
  <div id="state" class="state">กำลังโหลดข้อมูลจาก Supabase…</div>
  <div class="calendar" id="calendar"></div>
  <div class="legend"><span class="pill">💜 K-POP</span><span class="pill">💗 T-POP</span><span class="pill">💛 อื่นๆ</span><span class="pill">🟢 ว่าง</span><span class="pill">🟡 รอยืนยัน</span><span class="pill">⚪ จองแล้ว</span><span class="pill">⚠ ขอบเหลือง = มีคอนชนกัน</span></div>
  <div class="section"><h2>งานในเดือนนี้</h2><div id="eventList"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script>
const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const dows=['อา','จ','อ','พ','พฤ','ศ','ส'];
let view=new Date(); view.setDate(1); let rows=[];
function getSupabaseClient(){return window.supabaseClient||null}
function normalizeCategory(v){const x=String(v||'other').toLowerCase();if(x.includes('k'))return'kpop';if(x.includes('t'))return'tpop';return'other'}
function normalizeStatus(v){const x=String(v||'available').toLowerCase();return['available','pending','booked'].includes(x)?x:'available'}
function statusTH(s){return s==='pending'?'รอยืนยัน':s==='booked'?'จองแล้ว':'ว่าง'}
function ymd(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadData(){const state=document.getElementById('state'),sb=getSupabaseClient();if(!sb){state.className='state error';state.textContent='ยังไม่ได้เชื่อม Supabase client';render();return}try{state.className='state';state.textContent='กำลังโหลดข้อมูลจาก Supabase…';const{data,error}=await sb.from('event_dates').select('id,event_date,status,event_id,events!inner(id,name,category,venue,is_active)').order('event_date',{ascending:true});if(error)throw error;rows=(data||[]).filter(r=>r.events&&r.events.is_active!==false).map(r=>({date:r.event_date,status:normalizeStatus(r.status),eventId:r.event_id,dateId:r.id,name:r.events.name,category:normalizeCategory(r.events.category),venue:r.events.venue||''}));state.style.display='none';render()}catch(err){console.error(err);state.style.display='block';state.className='state error';state.textContent='โหลดข้อมูลไม่สำเร็จ: '+(err?.message||'Unknown error');render()}}
function render(){const y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=`${thMonths[m]} ${y}`;const cal=document.getElementById('calendar');cal.innerHTML=dows.map(x=>`<div class="dow">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)cal.insertAdjacentHTML('beforeend','<div class="day blank"></div>');for(let d=1;d<=days;d++){const key=ymd(y,m,d),hits=rows.filter(r=>r.date===key),uniqueEvents=new Set(hits.map(h=>h.eventId)).size;cal.insertAdjacentHTML('beforeend',`<div class="day ${uniqueEvents>1?'conflict':''}"><div class="num">${d}</div>${hits.map(h=>`<span class="event ${h.category} ${h.status}" title="${escapeHTML(h.name)} — ${statusTH(h.status)}"><i class="status-dot"></i>${escapeHTML(h.name)}</span>`).join('')}${uniqueEvents>1?`<div class="conflict-note">⚠ ${uniqueEvents} คอนชนกัน</div>`:''}</div>`)}const monthRows=rows.filter(r=>+r.date.slice(0,4)===y&&+r.date.slice(5,7)===m+1),grouped=new Map();monthRows.forEach(r=>{if(!grouped.has(r.eventId))grouped.set(r.eventId,{...r,dates:[]});grouped.get(r.eventId).dates.push({date:r.date,status:r.status})});const list=document.getElementById('eventList');list.innerHTML=grouped.size?[...grouped.values()].map(e=>{const dates=e.dates.map(x=>+x.date.slice(8,10)).join(', '),statuses=[...new Set(e.dates.map(x=>x.status))];return`<div class="row"><div class="date">${dates} ${thMonths[m].slice(0,3)}</div><div><b>${escapeHTML(e.name)}</b><div class="venue">${escapeHTML(e.venue)}</div></div><div class="badges">${statuses.map(s=>`<span class="badge ${s}">${statusTH(s)}</span>`).join('')}</div></div>`}).join(''):'<div class="sub">เดือนนี้ยังไม่มีงานในรายการ</div>'}
document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.getElementById('today').onclick=()=>{view=new Date();view.setDate(1);render()};render();loadData();window.AlicetleCalendar={reload:loadData,render};
</script>
</body>
</html>
